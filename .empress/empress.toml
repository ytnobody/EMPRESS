# EMPRESS project config. Shared with the team.
# Local-first by default: tasks live as local files, merges happen on local git.
# GitHub integration (gh) is strictly opt-in via [github] below.

[project]
base_branch = "main"
test_command = "bun scripts/selfcheck.ts"
language = "en"

[agent]
max_engineers = 2
loop_interval = 120
branch_prefix = "empress/task"

# Per-role model overrides. Empty (default) = use pi's default model.
# superintendent: the coordinator pass (empress run). engineer: spawned subagents.
# The CLI flag `empress run --model` still wins over this config.
[models]
superintendent = ""
engineer = ""

# Jev (System One, via the chariot CLI) drives judgments.
# Set TYPESAFE_API_KEY in your environment. If unset, EMPRESS falls back to rules.
[jev]
model = "jev-latest"

[risk]
use_jev = true
high_file_threshold = 20
high_line_threshold = 500
medium_file_threshold = 10
medium_line_threshold = 200
# Self-hosting: refactoring the harness control plane is always HIGH.
high_paths = ["src/extension/", "src/cli/", "src/shared/", "bin/", "package.json", "empress.toml", ".empress/agents/", "src/prompts/", "scripts/"]
medium_paths = ["src/domain/", "src/agents/"]

[readiness]
use_jev = true
min_body_length = 40

# [notification]
# webhook_url = "https://hooks.example.com/..."
# type = "generic"   # slack | discord | generic (auto-detected from URL if omitted)

[run]
failure_notify_threshold = 3

[ci]
engine = "podman"
image = "oven/bun:1.4-alpine"
network = "default"

[run]
failure_notify_threshold = 3
wake_interval = 60
audit_interval = 1800

# GitHub integration via the gh CLI — DISABLED (local-only default).
# Set enabled = true + owner/repo (or an origin remote) to push landed task
# branches and open PRs; e.g. for self-hosting this repo on GitHub:
#   enabled = true
#   owner = "yourname"
#   repo = "EMPRESS"
[github]
enabled = false
owner = ""
repo = ""
