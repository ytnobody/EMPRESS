# GitHub Actions CI for EMPRESS.
#
# The EMPRESS land gate is a LOCAL [ci] gate (scripts/selfcheck.ts run in the
# podman container / host). Now that the repo is on GitHub ([github] enabled),
# this workflow runs the SAME gate on GitHub Actions for every push/PR to main,
# so a red result blocks a merge on GitHub too.
#
# selfcheck does: `tsc --noEmit` (typecheck) + `bun test test/` (unit tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run selfcheck (typecheck + unit tests)
        run: bun scripts/selfcheck.ts