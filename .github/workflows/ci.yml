# GitHub Actions CI for EMPRESS.
#
# The EMPRESS land gate is a LOCAL [ci] gate (scripts/selfcheck.ts run in the
# podman container / host). Now that the repo is on GitHub ([github] enabled),
# this workflow runs the SAME gate on GitHub Actions for every push/PR to
# develop and main, so a red result blocks a merge on GitHub too.
#
# selfcheck does: `tsc --noEmit` (typecheck) + `bun test test/` (unit tests).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo-tree hygiene (no tracked gitignored runtime artifacts)
        run: |
          V=$(git ls-files -c -i --exclude-standard)
          if [ -n "$V" ]; then
            echo "::error::Tracked-but-gitignored runtime artifact(s) in tree: $V. Run 'git rm --cached' on them."
            exit 1
          fi
          echo "repo-tree hygiene: clean"

      - name: Run selfcheck (typecheck + unit tests)
        run: bun scripts/selfcheck.ts